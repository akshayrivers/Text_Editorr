[package]
name = "yonro_text_editor"
version = "1.0.0"
edition = "2021"

[dependencies]
crossterm = "0.27.0"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
tempfile = "3.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[lib]
name = "yonro_text_editor"
path = "src/lib.rs"

[[bin]]
name = "yonro_text_editor"
path = "src/main.rs"

[[bin]]
name = "benchmark_runner"
path = "src/bin/benchmark_runner.rs"

[[bench]]
name = "line_benchmarks"
harness = false

[[bench]]
name = "buffer_benchmarks"
harness = false

[[bench]]
name = "syntax_and_search_benchmarks"
harness = false

[[bench]]
name = "layout_and_pane_benchmarks"
harness = false

[[bench]]
name = "command_and_view_benchmarks"
harness = false

[[bench]]
name = "plugin_benchmarks"
harness = false

[[bench]]
name = "editor_e2e_benchmarks"
harness = false
